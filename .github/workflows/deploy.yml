
name: Validacion y despliegue automatico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Validar aplicacion
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          node --check app.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html

      - name: Preparar archivos
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp index.html styles.css app.js public/

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Subir sitio web
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
